apiVersion: v1
kind: Pod
metadata:
  name: quota-first
  namespace: hh-quota
  labels:
    lab: scheduling
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  containers:
  - name: sleep
    image: hh-skills:k8s
    imagePullPolicy: Never
    command:
    - python
    - -c
    - import time; time.sleep(1800)
    resources:
      requests:
        cpu: 300m
        memory: 32Mi
      limits:
        cpu: 300m
        memory: 128Mi

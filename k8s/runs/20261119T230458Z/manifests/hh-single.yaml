apiVersion: batch/v1
kind: Job
metadata:
  name: hh-single
  namespace: hh-k8s
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        lab: skills
    spec:
      restartPolicy: Never
      containers:
      - name: skills
        image: hh-skills:k8s
        imagePullPolicy: Never
        args:
        - run
        - --prefix
        - kubernetes/20261119T230458Z/single
        envFrom:
        - configMapRef:
            name: s3-config
        - secretRef:
            name: s3-credentials
        resources:
          requests:
            cpu: 200m
            memory: 16Mi
          limits:
            cpu: '1'
            memory: 128Mi

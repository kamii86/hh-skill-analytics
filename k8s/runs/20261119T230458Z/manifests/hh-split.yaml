apiVersion: batch/v1
kind: Job
metadata:
  name: hh-split
  namespace: hh-k8s
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        lab: skills
    spec:
      restartPolicy: Never
      containers:
      - name: skills
        image: hh-skills:k8s
        imagePullPolicy: Never
        args:
        - split
        - --prefix
        - kubernetes/20261119T230458Z
        - --parts
        - '4'
        envFrom:
        - configMapRef:
            name: s3-config
        - secretRef:
            name: s3-credentials
        resources:
          requests:
            cpu: 200m
            memory: 16Mi
            ephemeral-storage: 2Gi
          limits:
            cpu: '1'
            memory: 256Mi
            ephemeral-storage: 4Gi
        volumeMounts:
        - name: temp
          mountPath: /tmp
      volumes:
      - name: temp
        emptyDir:
          sizeLimit: 4Gi
